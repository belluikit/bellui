name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_golden:
        description: "Regenerate golden masters on the canonical runner and upload them as an artifact"
        type: boolean
        default: false

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # x/editor depends on the private belluikit/* modules; fetch them straight
  # from GitHub using the self-hosted runner's git credentials (no PAT needed).
  # (Vestigial file from the standalone-repo era — nested workflow files never
  # run on GitHub; the live CI for this module is the root x_tests.yml.)
  GOPRIVATE: github.com/belluikit/*

jobs:
  # Build/vet/test on the go-plus fork (macOS self-hosted). Golden image tests
  # are NOT run here — software font rasterization is platform-specific and the
  # committed masters are rendered on the canonical linux/amd64 box (see below).
  test:
    name: build + vet + test (macOS)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Assert go-plus toolchain
        run: |
          go version
          go version | grep -q '(plus)' || { echo "::error::runner go is not the go-plus fork"; exit 1; }
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  # Golden image tests render with the software painter and compare against
  # committed masters. Software font rasterization is platform-specific, so they
  # run ONLY on the canonical platform (linux/amd64, the "trader" runner) that
  # generated the masters. This leg keeps that coverage without regenerating the
  # masters on macOS.
  golden:
    name: golden image tests (linux/amd64 canonical)
    runs-on: [self-hosted, trader]
    steps:
      - uses: actions/checkout@v4
      - name: Assert go-plus toolchain
        run: |
          go version
          go version | grep -q '(plus)' || { echo "::error::runner go is not the go-plus fork"; exit 1; }
      - name: Golden image tests
        run: go test -run Golden -count=1 ./...
        env:
          FYCODER_GOLDEN: "1"
      - name: Upload golden diffs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-failed
          path: testdata/failed/
          if-no-files-found: ignore

  # Manual: regenerate golden masters on the canonical runner and upload them as
  # an artifact to download and commit. Run via the Actions tab with
  # "update_golden" checked.
  golden-update:
    name: Regenerate golden masters
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_golden }}
    runs-on: [self-hosted, trader]
    steps:
      - uses: actions/checkout@v4
      - name: Assert go-plus toolchain
        run: |
          go version
          go version | grep -q '(plus)' || { echo "::error::runner go is not the go-plus fork"; exit 1; }
      - name: Generate masters
        run: go test -run Golden -count=1 ./...
        env:
          FYCODER_GOLDEN: "1"
          UPDATE_TESTDATA: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: golden-masters
          path: testdata/*.png
