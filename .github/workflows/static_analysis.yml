name: Static Analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # cancel superseded runs on PR/feature branches, but never on main
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
env:
  CC: "clang"
  CGO_LDFLAGS: "-fuse-ld=lld"

jobs:
  static_analysis:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history + all branches so `buf breaking` can resolve the
          # origin/main baseline (the proto breaking-change check below).
          fetch-depth: 0
      - name: Assert go-plus toolchain
        run: |
          go version
          go version | grep -qE '\(plus[ )]' || { echo "::error::runner go is not the go-plus fork"; exit 1; }


      - name: Get dependencies
        run: |
          flock /tmp/bellui-ci-apt.lock sudo apt-get -o DPkg::Lock::Timeout=600 update
          flock /tmp/bellui-ci-apt.lock sudo apt-get -o DPkg::Lock::Timeout=600 install --no-install-recommends clang lld libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev xvfb language-pack-en

      - name: Set environment variable LANG
        run: export LANG=en_EN.UTF-8

      - name: Install analysis tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install lucor.dev/lian@latest

      - name: Install proto toolchain
        # buf drives generation via buf.yaml/buf.gen.yaml and invokes
        # protoc-gen-go directly, so no protoc binary is needed. Pin
        # protoc-gen-go to the version the committed .pb.go was generated with
        # so the up-to-date check below is reproducible.
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.45.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5

      - name: Put go-installed tools on PATH
        # `go install` drops binaries in $(go env GOPATH)/bin, which is not on
        # the self-hosted runner's PATH by default (GitHub-hosted runners add it,
        # ours don't). Export it so buf/gofumpt/staticcheck/gocyclo/lian below
        # are found instead of failing with "command not found".
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint protobuf
        run: buf lint

      - name: Check protobuf breaking changes (advisory)
        # Non-blocking (#930): these protos back on-disk .pxf stores, so a
        # wire-incompatible change (reused field number, changed type) silently
        # corrupts saved settings/preferences. Surface it in the PR log without
        # hard-failing intended schema evolution. WIRE-level rules (buf.yaml).
        # origin/main is available because checkout uses fetch-depth: 0.
        continue-on-error: true
        run: buf breaking --against '.git#ref=origin/main'

      - name: Check generated protobuf is up to date
        # Regenerating must leave the tree clean; a stale .pb.go fails the build
        # (the same guard other codegen benefits from). See hack/genproto.sh.
        run: |
          sh hack/genproto.sh
          if ! git diff --exit-code -- '*.pb.go'; then
            echo "::error::Generated protobuf is out of date. Run 'go generate ./...' (or sh hack/genproto.sh) and commit the result." >&2
            exit 1
          fi

      - name: Vet
        # Analyse both backends: the default WebGPU build and the GL fallback
        # (-tags gl). WebGPU vet compiles the wgpu-native cgo (headers ship in the
        # belluikit/webgpu module); no GPU needed since vet does not link/run.
        run: |
          go vet ./...
          go vet -tags gl ./...

      # The Linux webview backend bundles CEF (#60, #105) — the one documented
      # exception to "every backend uses the platform's own engine". This gate
      # keeps the exception exactly that wide: no other target's webview build
      # may grow a dependency on the CEF binding (#106). It has to be a
      # go-list check rather than a build failure, because belluikit/gocef
      # compiles everywhere by design (its unsupported stub) — a stray import
      # would break nothing and ship a pointless dependency silently.
      #
      # `go list -e` because several targets cannot fully build ./webview
      # without their platform toolchain; the encoding/json grep asserts the
      # listing still produced a real import graph (the portable files always
      # carry it), and the Linux positive control keeps the gate from going
      # vacuous if the module path ever changes.
      - name: Webview isolation (no CEF off Linux)
        run: |
          for target in "darwin arm64" "windows amd64" "js wasm" "android arm64" "ios arm64"; do
            set -- $target
            deps=$(GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go list -e -deps ./webview/)
            echo "$deps" | grep -q '^encoding/json$' || { echo "::error::go list for $1/$2 produced no usable import graph"; exit 1; }
            if echo "$deps" | grep -q 'belluikit/gocef'; then
              echo "::error::the $1/$2 webview build depends on belluikit/gocef — CEF must stay Linux-only"
              exit 1
            fi
            echo "$1/$2: clean"
          done
          CGO_ENABLED=1 GOOS=linux go list -deps ./webview/ | grep -q 'belluikit/gocef' \
            || { echo "::error::the Linux webview build no longer depends on belluikit/gocef — this gate is checking nothing"; exit 1; }
          echo "linux: gocef present (positive control)"

      - name: Formatting
        run: |
          gofumpt -d -e .
          test -z "$(goimports -e -d . | tee /dev/stderr)"

      # The limit is 30 and it is fully enforced on first-party main-module
      # code — no function we own exceeds it today, so this is a real gate, not
      # a rubber stamp (several sit at exactly 30).
      #
      # Two exclusions. gocyclo takes a filesystem path, so unlike
      # `go vet ./...` and `staticcheck ./...` — which stop at the module
      # boundary — it descends into everything under the working tree:
      #
      #   internal/{oksvg,rasterx,render}  absorbed srwiley code. Their PROVENANCE.md
      #                                    says to treat it as owned and patch in
      #                                    place, which is what happened for gofumpt
      #                                    and staticcheck — so this is NOT a
      #                                    "third-party, hands off" exemption. It is
      #                                    three genuinely complex functions
      #                                    (readStyleAttr 47, addSeg 44, strokeEdge
      #                                    43) whose refactor is real, risky work in
      #                                    a 2-D rasterizer, deferred to #18 rather
      #                                    than done alongside CI plumbing.
      #   x/                               separate Go modules. They need their own
      #                                    gocyclo step alongside their own build,
      #                                    test and vet — tracked in #13. Silently
      #                                    grading them here, while vet and
      #                                    staticcheck cannot see them at all, was
      #                                    incoherent.
      #
      # Both sets carry real violations (up to 67 in x/editor) — see #18. They are
      # scoped out, not forgiven.
      - name: Gocyclo
        run: gocyclo -over 30 -ignore 'internal/oksvg|internal/rasterx|internal/render|^x/' .

      - name: Staticcheck
        run: |
          staticcheck ./...
          staticcheck -tags gl ./...

      # The --excluded list is upstream's three prebuilt wgpu-native library
      # modules. They ship compiled artifacts and carry no licence file of their
      # own — an upstream gap, not ours: oliverbestmann's libs-* branches have
      # none either. Our two forked equivalents (libs-ios, libs-windows) DO now
      # carry the wgpu-native dual notice (MIT OR Apache-2.0), so they are
      # scanned normally rather than excluded.
      #
      # The artifacts are builds of gfx-rs/wgpu-native, whose Cargo.toml declares
      # `license = "MIT OR Apache-2.0"` — so this is a missing FILE, not an
      # unknown or incompatible licence. Exclusions pin repo@version and must be
      # refreshed on every bump; drop them once upstream ships licence files.
      # See #21.
      - name: Check license of dependencies
        run: |
          lian -d --allowed="Apache-2.0, BSD-2-Clause, BSD-3-Clause, MIT, ISC" \
            --excluded="github.com/oliverbestmann/webgpu/libs-android@v0.0.0-20260628152806-6b27e30a172e,github.com/oliverbestmann/webgpu/libs-darwin@v0.0.0-20260628152755-66a5dfa57f8d,github.com/oliverbestmann/webgpu/libs-linux@v0.0.0-20260628152803-421b8a341d08"
