name: Mobile Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # cancel superseded runs on PR/feature branches, but never on main
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
env:
  CC: "clang"
  CGO_LDFLAGS: "-fuse-ld=lld"

jobs:
  mobile_tests:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: stable
            go-version: stable
          # The toolchain go.mod's `go` directive pins, the oldest Go an app
          # may build Bellui with (#719). GOTOOLCHAIN=local stops the go
          # command from switching to another toolchain.
          - go: go.mod
            go-version-file: go.mod
            gotoolchain: local
    env:
      # Empty on the stable leg, which leaves the go command's default.
      GOTOOLCHAIN: ${{ matrix.gotoolchain }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}

      # Positive marker: the toolchain the tests below run on. On the
      # go.mod leg it must be exactly the `go` directive's version.
      - name: Go version
        run: |
          go version
          if [ -n "${{ matrix.go-version-file }}" ]; then
            want="go$(go mod edit -json | jq -r .Go)"
            got="$(go env GOVERSION)"
            if [ "$got" != "$want" ]; then
              echo "::error::expected $want from go.mod, running $got"
              exit 1
            fi
          fi

      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld libegl1-mesa-dev libgles2-mesa-dev libx11-dev libwayland-dev libxkbcommon-dev xorg-dev

      # WebGPU is the default mobile backend (Phase 5, pre-rebrand tracker #204); GLES is the fallback
      # behind -tags gl. This comprehensive leg exercises the GLES fallback path.
      - name: Tests (GLES fallback)
        run: ./.github/scripts/xvfb-run-safe go test -race -tags gl,mobile,ci,migrated_belluido ./...

      # Apps' own tests run without migrated_belluido, and there the mobile
      # build reports every goroutine as main until one is registered. The test
      # driver must still serialize bellui.Do under that rule (#639); the leg
      # above sets the tag and so never sees it.
      - name: Test driver threading without migrated_belluido
        run: |
          go test -race -tags mobile,ci ./test/ ./storage/repository/
          go test -race -tags mobile,ci -run 'TestFileTree_' ./widget/

      - name: Partial-repaint build + region logic
        run: |
          # Dirty-region partial repaint is on by default on desktop (#496)
          # and on Android/iOS with WebGPU (#593), and off with -tags gl on
          # mobile, which was not validated on a device; the partialrepaint
          # tag forces it on for that build. Verify it compiles and that the
          # region computation is correct. The webgpu default is covered by
          # the WebGPU mobile build step below.
          go build -tags gl,partialrepaint ./...
          go vet -tags gl,mobile,partialrepaint ./internal/driver/mobile/ ./internal/driver/common/
          ./.github/scripts/xvfb-run-safe go test -tags gl,partialrepaint,ci,migrated_belluido ./internal/driver/common/

      # Mobile accessibility backends (pre-rebrand tracker #488): the shared flatten layer and its
      # tests compile in the host slice under -tags accessibility, mirroring
      # the desktop legs in platform_tests. The android/ios cgo bridges need a
      # device toolchain (NDK / Xcode) and are cross-compile-verified locally.
      - name: Accessibility tagged tests
        run: ./.github/scripts/xvfb-run-safe go test -race -tags accessibility,gl,mobile,ci,migrated_belluido ./internal/driver/mobile/ ./internal/accessibility/...

      - name: Compile (GLES fallback)
        working-directory: cmd/bellui_settings
        run: go build -tags gl,mobile

      # WebGPU mobile backend (default): wgpu-native via Vulkan (Android) / Metal
      # (iOS). Builds the whole tree: now that internal/painter/gl carries the GL
      # build constraint (pre-rebrand tracker #251), ./... no longer compiles the unused GL gomobile
      # painter under -tags mobile, so the full module is clean on the webgpu
      # default. Clean CGO env for the wgpu-native link; the host (linux) slice
      # uses the stub surface descriptor.
      - name: WebGPU mobile build (default)
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
        run: |
          go build -tags mobile ./...
          go build -tags mobile ./cmd/bellui_settings
