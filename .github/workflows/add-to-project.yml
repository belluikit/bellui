name: Add issues to projects

# Free-plan replacement for the built-in "Auto-add to project" workflow
# (Team/Enterprise only). Every issue is added to the backlog board; issues
# labeled design-tool or ota additionally land in the AppViewer Platform board.
# addProjectV2ItemById is idempotent — re-adding returns the existing item — so
# relabeling and reopening are harmless.
#
# Runs on the self-hosted fleet: the job is one API call, and hosted minutes are
# billable on a private repo. [self-hosted, Linux, ARM64] is the repo's usual
# label set and resolves to linux_parallels, the only Linux runner with the gh
# CLI installed (trader has none).
#
# The boards are addressed by node ID rather than `gh project item-add --owner`,
# which has to resolve the owner to a user-or-org first: that lookup fails on the
# runner's gh 2.46 with a bare "unknown owner type", and node IDs are stable and
# version-independent. IDs from:
#   gh api graphql -f query='{user(login:"trendvidia"){projectV2(number:N){id}}}'
#
# AUTH: needs a token with the `project` scope plus read access to this repo's
# issues — a classic PAT in the ADD_TO_PROJECT_PAT secret. The built-in
# GITHUB_TOKEN cannot write to user-owned Projects, which is why a secret is
# needed at all. Without the secret the job falls back to the runner's own gh
# credentials; as of 2026-07-28 those are expired on every machine in the fleet,
# so the secret is the working path. Note `gh auth status` exits 0 even on an
# invalid token in gh 2.46 — `gh api user` is the probe that actually tells.

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: read

env:
  BACKLOG_PROJECT_ID: PVT_kwHODA3w3s4Bchjn # trendvidia/projects/2
  PLATFORM_PROJECT_ID: PVT_kwHODA3w3s4BcfeP # trendvidia/projects/1

jobs:
  add-to-project:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Add to projects
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            unset GH_TOKEN # fall back to the runner's own gh credentials
            echo "::notice::ADD_TO_PROJECT_PAT is not set; trying the runner's own gh credentials."
          fi

          if ! gh api user --jq .login >/dev/null 2>&1; then
            echo "::error::No usable GitHub credentials. Provision the ADD_TO_PROJECT_PAT secret (classic PAT, 'project' + 'repo' scopes), or run 'gh auth login' on this runner."
            exit 1
          fi

          add_to() { # $1 = project node ID, $2 = human name
            echo "Adding $ISSUE_URL to $2"
            gh api graphql \
              -f query='mutation($project:ID!, $content:ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                  item { id }
                }
              }' \
              -f project="$1" -f content="$ISSUE_NODE_ID" \
              --jq '.data.addProjectV2ItemById.item.id'
          }

          add_to "$BACKLOG_PROJECT_ID" "the backlog board"

          case ",$ISSUE_LABELS," in
            *,design-tool,* | *,ota,*)
              add_to "$PLATFORM_PROJECT_ID" "the AppViewer Platform board"
              ;;
            *)
              echo "Not labeled design-tool or ota; skipping the AppViewer Platform board."
              ;;
          esac
