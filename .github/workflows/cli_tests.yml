name: CLI Tests

# The bellui CLI is a nested module (cmd/bellui, github.com/belluikit/bellui/cmd/bellui)
# so it is NOT covered by the library module's `./...` in the other workflows.
# This workflow builds/tests it. The nested module `require`s the (private)
# toolkit module at a released version. Each job adds an ephemeral `replace` to
# the local checkout (go mod edit -replace .../bellui=../..) so the CLI builds
# against the toolkit code in THIS PR — always current, no version-pin
# coupling. The committed go.mod keeps its version pin, so
# `go install .../bellui/cmd/bellui@…` still works for consumers.

on:
  push:
    paths:
      - "cmd/bellui/**"
      - "internal/driver/mobile/app/*.java"
      - ".github/workflows/cli_tests.yml"
  pull_request:
    paths:
      - "cmd/bellui/**"
      - "internal/driver/mobile/app/*.java"
      - ".github/workflows/cli_tests.yml"

permissions:
  contents: read

jobs:
  cli_tests:
    runs-on: ${{ matrix.runs-on }}
    # Per-OS default shell: bash on Linux/macOS, Windows PowerShell 5.1
    # ('powershell') on Windows.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-24.04-arm
            shell: bash
          - os: macos
            runs-on: macos-15
            shell: bash
          - os: windows
            runs-on: windows-2025
            shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Resolve the toolkit from this checkout
        working-directory: cmd/bellui
        run: go mod edit -replace github.com/belluikit/bellui=../..
      - name: Build
        working-directory: cmd/bellui
        run: go build ./...
      - name: Vet
        working-directory: cmd/bellui
        run: go vet ./...
      - name: Tests
        working-directory: cmd/bellui
        run: go test -race -tags ci ./...
      # The packaging tests that run the real Android SDK tools skip when the
      # SDK is missing, so a plain `go test` passing proves nothing about them.
      # The Windows image ships the SDK and a JDK; there d8 and apksigner are
      # .bat files run through cmd.exe (#674), and jarsigner.exe signs a release
      # bundle with its passwords from the environment (#729). This step fails unless the tests
      # report PASS, so a silent skip cannot pass for a run.
      - name: Android SDK tools on Windows
        if: matrix.os == 'windows'
        working-directory: cmd/bellui
        run: |
          Write-Output "ANDROID_HOME=$env:ANDROID_HOME"
          Get-ChildItem "$env:ANDROID_HOME\build-tools" | Select-Object -ExpandProperty Name
          Get-Command javac | Select-Object -ExpandProperty Source
          go test -race -tags ci -count=1 -v -run 'TestPackageAndroid|TestCommandRunsBatchFile|TestReleaser' ./internal/mobile/ ./internal/util/ ./internal/commands/ | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($t in 'TestPackageAndroidLibs', 'TestPackageAndroidJarsOnlyKeepsBinresPath', 'TestCommandRunsBatchFile', 'TestReleaserAfterPackageAndroid', 'TestReleaserSignsWithJarsigner') {
            if (-not ($out | Select-String -SimpleMatch "--- PASS: $t ")) { Write-Output "::error::$t did not PASS (skipped?)"; exit 1 }
          }
      # A real `bellui package -os android/arm64` of an app with its own
      # AndroidManifest.xml must warn that the icon credit is not in it (#714).
      # It needs the NDK, which the macOS and Windows images ship
      # ($ANDROID_NDK_HOME). BELLUI_REQUIRE_ANDROID_NDK=1 turns a missing NDK
      # into a failure, and the PASS check catches any other skip.
      - name: Android packaging with the NDK (macOS)
        if: matrix.os == 'macos'
        working-directory: cmd/bellui
        env:
          BELLUI_REQUIRE_ANDROID_NDK: "1"
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          go test -race -tags ci -count=1 -v -run 'TestPackageAndroidOwnManifestWarnsTheCreditIsMissing$' ./internal/commands/ | tee "$RUNNER_TEMP/android-ndk.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q -- '--- PASS: TestPackageAndroidOwnManifestWarnsTheCreditIsMissing ' "$RUNNER_TEMP/android-ndk.log" || { echo "::error::TestPackageAndroidOwnManifestWarnsTheCreditIsMissing did not PASS (skipped?)"; exit 1; }
      - name: Android packaging with the NDK (Windows)
        if: matrix.os == 'windows'
        working-directory: cmd/bellui
        env:
          BELLUI_REQUIRE_ANDROID_NDK: "1"
        run: |
          Write-Output "ANDROID_HOME=$env:ANDROID_HOME ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"
          go test -race -tags ci -count=1 -v -run 'TestPackageAndroidOwnManifestWarnsTheCreditIsMissing$' ./internal/commands/ | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not ($out | Select-String -SimpleMatch "--- PASS: TestPackageAndroidOwnManifestWarnsTheCreditIsMissing ")) { Write-Output "::error::TestPackageAndroidOwnManifestWarnsTheCreditIsMissing did not PASS (skipped?)"; exit 1 }

  cli_static_analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Resolve the toolkit from this checkout
        working-directory: cmd/bellui
        run: go mod edit -replace github.com/belluikit/bellui=../..
      - name: Install analysis tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Put go-installed tools on PATH
        # Export $(go env GOPATH)/bin explicitly so the go-installed tools below
        # are found regardless of what the runner image put on PATH.
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Formatting
        working-directory: cmd/bellui
        run: |
          gofumpt -d -e .
          test -z "$(goimports -e -d . | tee /dev/stderr)"
      - name: Gocyclo
        working-directory: cmd/bellui
        run: gocyclo -over 30 .
      - name: Staticcheck
        working-directory: cmd/bellui
        run: staticcheck ./...

  # Anti-coupling gate: the CLI's embedded Android dex is compiled from the
  # toolkit's GoNativeActivity.java. A strict byte-diff regen check is not used
  # because dex/javac output is not reproducible across toolchain versions (it
  # would false-fail on every PR). Instead, enforce the discipline that a change
  # to the native Java must land WITH a regenerated dex.go in the same PR — the
  # co-located workflow that replaced the old cross-repo split. (Regen with:
  # `cd cmd/bellui/internal/mobile && go generate`, Android SDK on PATH.)
  # A change to comments and blank lines only is exempt: comments are not
  # compiled, so the regenerated dex.go would be identical and git would
  # show no change to commit (#366).
  dex_regenerated_with_java:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Java change requires a dex regen
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          java=$(echo "$changed" | grep -c '^internal/driver/mobile/app/GoNativeActivity\.java$' || true)
          dex=$(echo "$changed" | grep -c '^cmd/bellui/internal/mobile/dex\.go$' || true)
          if [ "$java" -gt 0 ] && [ "$dex" -eq 0 ]; then
            # Changed lines that are not a comment or blank. A line mixing
            # code and a comment counts as code.
            code=$(git diff -U0 "$BASE" "$HEAD" -- internal/driver/mobile/app/GoNativeActivity.java \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' \
              | sed -E 's/^[+-][[:space:]]*//' \
              | grep -vE '^(//|/\*|\*|$)' || true)
            if [ -n "$code" ]; then
              echo "::error::GoNativeActivity.java changed but cmd/bellui/internal/mobile/dex.go did not. Regenerate the embedded dex ('cd cmd/bellui/internal/mobile && go generate') and commit it in this PR." >&2
              echo "Changed code lines:" >&2
              echo "$code" >&2
              exit 1
            fi
            echo "ok: only comments changed in GoNativeActivity.java; the dex is unaffected"
            exit 0
          fi
          echo "ok: Java=$java dex=$dex"
