name: Web Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # cancel superseded runs on PR/feature branches, but never on main
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web_tests:
    # x86_64 on purpose: the wasm build is arch-independent, and the arm64
    # runner image ships no browser for the headless test leg below.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # WebGPU (browser WebGPU) is the default wasm backend (Phase 5, pre-rebrand tracker #204); the
      # WebGL gl-js path is the fallback behind -tags gl. Build both. wasm has no
      # cgo, so no wgpu-native libs are needed here; osusergo avoids the wasm
      # os/user dependency on the default build.
      - name: Build WebAssembly binary (WebGPU, default)
        env:
          GOOS: js
          GOARCH: wasm
        working-directory: cmd/bellui_settings
        run: go build -tags osusergo

      # The test helpers must not reach a shipped binary (#304). driver/software
      # is linked into every desktop and web build, and while it imported
      # bellui/test it dragged testify and gopkg.in/yaml.v3 along: 500,910 bytes
      # of code, 2.2% of the code section, in the wasm build above. The gate
      # lives on the web leg because payload size is a product metric here.
      #
      # Both build tag sets are checked: a !wasm/wasm split could otherwise
      # reintroduce the import on the leg the other check does not compile.
      - name: Assert no test-only packages in the web binary
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: "0"
        working-directory: cmd/bellui_settings
        run: |
          set -euo pipefail
          for tags in osusergo gl; do
            go list -deps -tags "$tags" . > deps.txt
            # Positive marker: an empty or partial listing must fail loudly
            # rather than read as "no test packages found".
            grep -qx 'github.com/belluikit/bellui/driver/software' deps.txt || {
              echo "::error::-tags $tags: driver/software is not in the dependency listing — the check did not measure what it claims"
              exit 1
            }
            found=$(grep -E '^(testing|github.com/stretchr/testify|gopkg.in/yaml.v3|github.com/belluikit/bellui/(internal/)?test)($|/)' deps.txt || true)
            if [ -n "$found" ]; then
              echo "::error::-tags $tags: test-only packages linked into the web binary:"
              echo "$found"
              exit 1
            fi
          done
          rm -f deps.txt

      - name: Build WebAssembly binary (WebGL fallback)
        env:
          GOOS: js
          GOARCH: wasm
        working-directory: cmd/bellui_settings
        run: go build -tags gl

      # wasmbrowsertest drives a headless browser through chromedp, which finds
      # it as `chromium` on PATH. The runner image ships Google Chrome; a shim
      # named `chromium` launches it with --no-sandbox, because Ubuntu 24.04's
      # AppArmor policy blocks the unprivileged user namespaces Chrome's own
      # sandbox needs. This is CI running our own code in a throwaway VM.
      - name: Put a chromium shim on PATH
        run: |
          set -euo pipefail
          real=$(command -v google-chrome || command -v google-chrome-stable || true)
          test -n "$real" || { echo "::error::no google-chrome on the runner image"; exit 1; }
          mkdir -p "$RUNNER_TEMP/browser-bin"
          cat > "$RUNNER_TEMP/browser-bin/chromium" <<SHIM
          #!/usr/bin/env bash
          exec $real --no-sandbox "\$@"
          SHIM
          chmod +x "$RUNNER_TEMP/browser-bin/chromium"
          echo "$RUNNER_TEMP/browser-bin" >> "$GITHUB_PATH"
          # Positive marker: prove the shim launches a browser before the tests
          # depend on it, so a launch failure is reported here rather than as
          # 40-odd unrelated package failures.
          "$RUNNER_TEMP/browser-bin/chromium" --headless --disable-gpu --dump-dom about:blank > /dev/null
          echo "chromium shim launches OK ($real)"

      # Every painter WGSL shader through Chrome's WebGPU compiler, Tint (#685).
      # Native wgpu accepted a shader Tint rejected, and v1.2.0 shipped a black
      # page on every wasm WebGPU app. The test runs headless Chrome on its
      # SwiftShader software adapter, so no GPU is needed. BELLUI_REQUIRE_TINT
      # turns "no browser" / "no adapter" into failures, and the grep requires
      # the line the test logs only when it ran — a skip or an empty -run
      # match must not read as green.
      - name: WGSL compiles with Chrome's Tint
        env:
          BELLUI_REQUIRE_TINT: "1"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go test -count=1 -v -run '^TestShadersCompileWithTint$' ./internal/painter/webgpu/tintcheck/ | tee tint.log
          grep -E 'compiled [0-9]+ shaders via Tint' tint.log
          rm -f tint.log

      # Real-DOM execution leg (#73). wasmbrowsertest runs the test binary in
      # headless Chromium, so the wasm packages are exercised against a real
      # browser — real IndexedDB for app's storage tests, a real
      # iframe/postMessage surface for webview — rather than only
      # type-checked. Needs `chromium` on PATH — supplied by the shim above.
      #
      # Scope is the FULL module (#79): every eligible package was triaged —
      # in-browser failures either got #77-style !wasm splits (behaviour the
      # browser genuinely lacks: listeners, on-disk stores, fsnotify, -race
      # busy-loop harnesses) or a filed issue (#168 RTL divergence, #169 wgpu
      # JS glue). Excluded: internal/gsportal (no wasm build), the mobile
      # driver, cmd/ and hack/ (not wasm targets), and the vendored
      # oksvg/rasterx/render (their golden tests REWRITE checked-in masters
      # when run under wasm — and the code is not ours, the gocyclo rationale).
      # Each package costs a browser launch: the green sweep measured ~3 min
      # of browser time locally (arm64 mac); budget more here.
      - name: Install wasmbrowsertest
        run: go install github.com/agnivade/wasmbrowsertest@v0.11.0

      - name: Test WebAssembly (headless Chromium)
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: "0"
        run: |
          pkgs=$(go list ./... | grep -vE 'internal/gsportal|internal/driver/mobile|/cmd/|/hack/|internal/(oksvg|rasterx|render)')
          # -p 1: one package at a time, so one browser at a time. go test
          # parallelises packages by default (GOMAXPROCS), and every package
          # here launches its own headless browser with a wasm binary loaded.
          # Several at once starve memory: a browser is killed mid-run and its
          # package reports "context canceled", which reads as a test failure
          # in an unrelated package (#79). The parallelism bought little
          # anyway — the cost here is browser startup per package, not CPU.
          go test -p 1 -tags ci -timeout 240s -exec="$(go env GOPATH)/bin/wasmbrowsertest" $pkgs
