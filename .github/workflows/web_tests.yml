name: Web Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # cancel superseded runs on PR/feature branches, but never on main
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web_tests:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assert go-plus toolchain
        run: |
          go version
          go version | grep -qE '\(plus[ )]' || { echo "::error::runner go is not the go-plus fork"; exit 1; }


      # WebGPU (browser WebGPU) is the default wasm backend (Phase 5, #204); the
      # WebGL gl-js path is the fallback behind -tags gl. Build both. wasm has no
      # cgo, so no wgpu-native libs are needed here; osusergo avoids the wasm
      # os/user dependency on the default build.
      - name: Build WebAssembly binary (WebGPU, default)
        env:
          GOOS: js
          GOARCH: wasm
        working-directory: cmd/bellui_settings
        run: go build -tags osusergo

      - name: Build WebAssembly binary (WebGL fallback)
        env:
          GOOS: js
          GOARCH: wasm
        working-directory: cmd/bellui_settings
        run: go build -tags gl

      # Real-DOM execution leg (#73). wasmbrowsertest runs the test binary in
      # headless Chromium, so the wasm packages are exercised against a real
      # browser — real IndexedDB for app's storage tests, a real
      # iframe/postMessage surface for webview — rather than only
      # type-checked. Needs `chromium` on PATH (snap on the Ubuntu runner).
      # Scope: ./webview/ plus ./app/ and ./dialog/, triaged in #79; each
      # package costs a browser launch, and the remaining packages are still
      # unmeasured — widen one at a time as each is triaged (#79).
      - name: Install wasmbrowsertest
        run: go install github.com/agnivade/wasmbrowsertest@v0.11.0

      - name: Test WebAssembly (headless Chromium)
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: "0"
        run: go test -tags ci -exec="$(go env GOPATH)/bin/wasmbrowsertest" ./webview/ ./app/ ./dialog/
