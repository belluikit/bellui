# Nightly run of the local (!ci) glfw driver test suite (#592).
#
# These tests are tagged `!no_glfw && !ci && !mobile`, so no PR/push workflow
# ever runs them — they rotted silently until #590/#592. They open real GLFW
# windows, so they run on Linux, where xvfb-run-safe gives them a headless
# display. `-tags gl` selects the pure-Go GL fallback so the leg needs
# no GPU, mirroring the comprehensive linux leg in platform_tests.
name: Local GLFW Suite

on:
  schedule:
    - cron: "17 3 * * *" # nightly, off-hours UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  local_glfw_suite:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc clang lld libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev xvfb language-pack-en
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-fuse-ld=lld" >> "$GITHUB_ENV"

      - name: Local glfw suite
        run: ./.github/scripts/xvfb-run-safe go test -tags gl -timeout 20m ./internal/driver/glfw/
