name: Platform Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # cancel superseded runs on PR/feature branches, but never on main
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  platform_tests:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["stable"]
        platform: [linux, linux-x64, macos]
        include:
          - platform: linux
            runs-on: ubuntu-24.04-arm
            runner: ./.github/scripts/xvfb-run-safe
            # WebGPU is the default backend; the legacy GL/GLES path is now opt-in
            # via -tags gl. This comprehensive leg exercises the GL fallback (pure
            # Go link, no GPU) and holds the coverage gate; the webgpu_tests job
            # below covers the default WebGPU backend.
            tags: gl,ci,migrated_belluido
            coverage: true
          # Same suite on x86_64. The other Linux legs in this workflow are ARM64,
          # so this is what catches amd64-specific breakage: assembly and SIMD
          # paths (the vectorized newline scan in internal/textbuf), cgo struct
          # layout and alignment against the X11/Wayland/GL headers, and unsafe
          # pointer arithmetic all differ by arch. Pure Go link, no GPU.
          - platform: linux-x64
            runs-on: ubuntu-24.04
            runner: ./.github/scripts/xvfb-run-safe
            tags: gl,ci,migrated_belluido
            # The ARM64 leg owns the coverage gate; running it twice would just
            # spend minutes to assert the same number.
            coverage: false
          - platform: macos
            runs-on: macos-15
            tags: gl,no_glfw,ci,migrated_belluido
            coverage: false

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc clang lld libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev xvfb language-pack-en
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-fuse-ld=lld" >> "$GITHUB_ENV"
        if: ${{ runner.os == 'Linux' }}

      - name: Set environment variable LANG
        run: export LANG=en_EN.UTF-8
        if: ${{ runner.os == 'Linux' }}

      - name: Tests
        run: ${{ matrix.runner }} go test -race -tags "${{ matrix.tags }}" -covermode=atomic -coverprofile=coverage.out ./...

      # Accessibility semantic layer (pre-rebrand tracker #484) + platform backends (pre-rebrand tracker #485): the
      # tree walker and the NSAccessibility bridge only compile under
      # -tags accessibility, so exercise them explicitly on both desktop
      # platforms to keep the tagged code from rotting. The test build pulls
      # in widget/container/test with the tag set, which doubles as a
      # tagged compile gate for the wider tree; the glfw package compiles the
      # darwin cgo backend on the macOS leg (its heavy tests stay excluded by
      # the no_glfw/ci tags).
      - name: Accessibility tagged tests
        run: ${{ matrix.runner }} go test -race -tags "accessibility,${{ matrix.tags }}" ./internal/accessibility/... ./core/... ./internal/driver/glfw/

      # iOS accessibility compile gate (pre-rebrand tracker #1037): the `accessibility && ios`
      # slice (accessibility_ios.{go,m,h} + the iOS halves of the mobile
      # driver) needs the iPhone SDK, so only this leg can compile it — pre-rebrand tracker #1036
      # landed silently because none did. Compile-only, non-main packages
      # (no link, no signing): the iOS app closure (`app` selects the mobile
      # driver under GOOS=ios) plus every package carrying ios-tagged files.
      # Runtime coverage stays on-device.
      - name: iOS accessibility compile smoke
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CGO_CFLAGS="-isysroot $SDK -miphoneos-version-min=15.0 -w"
          export CGO_LDFLAGS="-isysroot $SDK -miphoneos-version-min=15.0"
          go build -tags accessibility ./app/ ./dialog/ ./storage/ ./widget/ ./theme/ ./internal/driver/mobile/...
        if: ${{ runner.os == 'macOS' }}

      - name: Wayland Tests
        run: go test -race -tags gl,no_glfw,ci,wayland ./...
        if: ${{ runner.os == 'Linux' }}

      # The default build now selects X11/Wayland at runtime (pre-rebrand tracker #542), so the
      # forced single-backend `x11` build is the only path not exercised above.
      # Compile-smoke the driver package in both painter modes so the forced-x11
      # files (backend_webgpu_x11.go, window_x11.go) can't rot.
      - name: X11 forced-build smoke
        run: |
          go build -tags x11 ./internal/driver/glfw/
          go build -tags gl,x11 ./internal/driver/glfw/
        if: ${{ runner.os == 'Linux' }}

      - name: Update coverage
        run: |
          set -e
          coverage=`go tool cover -func coverage.out | grep total | tr -s '\t' | cut -f 3 | grep -o '[^%]*'`
          if (( $(echo "$coverage < 62" | bc) )); then echo "Test coverage lowered"; exit 1; fi
        if: ${{ matrix.coverage && matrix.go-version == 'stable' }}


  # WebGPU is the default backend (Phase 5, pre-rebrand tracker #204). This job builds the default
  # ./... and runs the WebGPU painter's headless readback tests: Vulkan through
  # Mesa's lavapipe software ICD on Linux, Metal on macOS. The wgpu-native libs
  # ship in the belluikit/webgpu module (no system install); the link requires
  # a clean CGO env (no -fuse-ld=lld).
  webgpu_tests:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: ubuntu-24.04-arm
            runner: ./.github/scripts/xvfb-run-safe
          - platform: macos
            runs-on: macos-15
            runner: ""
    env:
      # wgpu-native links cleanly only without the host's -fuse-ld=lld / CFLAGS.
      CGO_LDFLAGS: ""
      CGO_CFLAGS: ""
      # Both legs have an adapter (lavapipe, Metal), so a painter GPU test that
      # cannot get one fails instead of skipping: a skip prints the same "ok"
      # as a pass (#449).
      BELLUI_REQUIRE_WEBGPU: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Get dependencies
        # mesa-vulkan-drivers provides lavapipe, a deterministic headless Vulkan
        # ICD for the readback tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev xvfb mesa-vulkan-drivers libvulkan1
        if: ${{ runner.os == 'Linux' }}

      - name: Build default (WebGPU) ./...
        run: go build ./...

      - name: WebGPU painter GPU tests
        run: ${{ matrix.runner }} go test -v -count=1 ./internal/painter/webgpu/...

      # Real-window surface configure → present → Canvas().Capture() coverage on
      # the default WebGPU backend (Metal on macOS, Vulkan/lavapipe on Linux).
      # Every other WebGPU GPU test is offscreen readback and never creates a
      # surface or presents; this is the only standing net for that path (pre-rebrand tracker #329).
      # No ci/gl/no_glfw tags so it builds WebGPU on a real window; the test
      # self-skips if no window/adapter is available. ./.github/scripts/xvfb-run-safe
      # supplies the Linux display.
      - name: WebGPU windowed present + Capture (#329)
        run: ${{ matrix.runner }} go test -v -run TestWindowedSurfaceCapture -count=1 -timeout 120s ./internal/driver/glfw/

      # The same with partial repaint off (#496). It is on by default on
      # desktop, so this keeps the full-repaint paint path, which mobile and the
      # web use, covered too.
      - name: WebGPU windowed present + Capture, nopartialrepaint (#496)
        run: ${{ matrix.runner }} go test -v -tags nopartialrepaint -run TestWindowedSurfaceCapture -count=1 -timeout 120s ./internal/driver/glfw/


  windows_tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # cgo (and so -race) uses the image's MinGW-w64 gcc, which is on PATH.
      - name: Tests (GL fallback)
        shell: bash
        run: |
          # Resolve the package set, and refuse to proceed on a collapsed list:
          # an inline $(go list ...) that fails prints nothing to stdout, and a
          # near-empty test run would otherwise read as green (pre-rebrand tracker #565).
          pkgs=$(go list -tags gl,ci,no_glfw,migrated_belluido ./... || true)
          n=$(printf '%s\n' "$pkgs" | grep -c . || true)
          echo "Resolved ${n} packages to test"
          if [ "${n}" -lt 50 ]; then
            echo "::error::go list resolved only ${n} packages — refusing to green-light a near-empty test run (#565)"
            exit 1
          fi
          go test -race -tags gl,ci,no_glfw,migrated_belluido ${pkgs}

      # Accessibility semantic layer (pre-rebrand tracker #484) + Windows UIA backend (pre-rebrand tracker #487):
      # the walker and the UIA cgo bridge only compile under
      # -tags accessibility, so exercise them explicitly — mirroring the
      # linux/macOS legs — to keep the tagged code (and its mingw build)
      # from rotting.
      - name: Accessibility tagged tests
        shell: bash
        run: go test -race -tags accessibility,gl,ci,no_glfw,migrated_belluido ./internal/accessibility/... ./core/... ./internal/driver/glfw/

      # WebGPU (default) on Windows = D3D12. Build the default ./... — this
      # links the wgpu-native archive and guards it from rotting. Clean CGO env
      # for the wgpu-native link.
      - name: WebGPU build (D3D12)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
        run: go build ./...

      # Headless readback via the default all-backends instance. The hosted
      # runner has no GPU, so D3D12 runs on whatever adapter the image offers
      # (WARP). BELLUI_REQUIRE_WEBGPU makes a missing adapter fail rather than
      # skip (#449).
      - name: WebGPU painter GPU tests (D3D12)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
          BELLUI_REQUIRE_WEBGPU: "1"
        run: go test -v -count=1 ./internal/painter/webgpu/...

      # Real-window present + Canvas().Capture() coverage on D3D12 (pre-rebrand tracker #329);
      # self-skips if no window/adapter.
      #
      # Needs a desktop session: in a session-0 service, D3D12's
      # CreateSwapChainForHwnd answers DXGI_ERROR_NOT_CURRENTLY_AVAILABLE, which
      # wgpu-native turns into a fatal panic rather than a returnable error
      # (#20, #25). GitHub's hosted Windows runners run jobs in an interactive
      # session. If this step starts aborting in wgpuSurfaceConfigure, suspect
      # the session first.
      - name: WebGPU windowed present + Capture (D3D12, x64)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
        run: go test -v -run TestWindowedSurfaceCapture -count=1 -timeout 120s ./internal/driver/glfw/


  # Windows on ARM64, the second mingw flavor. The x64 job builds the UIA cgo
  # bridge with MinGW-w64 gcc; this one uses llvm-mingw clang, and the two
  # disagree often enough to matter — the hand-written COM vtable slot offsets in
  # internal/driver/glfw/accessibility_windows.c are laid out against
  # uiautomationcore.h, and pointer-width-independent struct packing is exactly
  # the kind of thing only a second compiler catches. Deliberately a separate job
  # rather than a matrix leg on windows_tests: matrixing would rename that job's
  # check to `windows_tests (x64)` and silently drop it from any branch
  # protection rule referencing the old name.
  windows_arm64_tests:
    runs-on: windows-11-arm
    env:
      LLVM_MINGW: llvm-mingw-20261006-ucrt-aarch64
      # GitHub's published digest for that release asset.
      LLVM_MINGW_SHA256: 9a835d5179c9f3a5a783c11a7f14062a249b4765dd11add64a66786864e82ab2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # The image's own gcc is not llvm-mingw, and llvm-mingw is the point of
      # this job, so install a pinned release and put it first on PATH.
      - name: Install llvm-mingw
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm-mingw.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/${LLVM_MINGW}.zip"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          bin="$(cygpath -w "$RUNNER_TEMP/$LLVM_MINGW/bin")"
          echo "$bin" >> "$GITHUB_PATH"
          echo "CC=$bin\\clang.exe" >> "$GITHUB_ENV"
          # Positive marker: the compiler cgo will use is the one just installed.
          "$RUNNER_TEMP/$LLVM_MINGW/bin/clang.exe" --version | head -1

      # No -race anywhere in this job: the race detector has no windows/arm64
      # support (`go build -race` fails outright with "-race is not supported on
      # windows/arm64"), so race coverage stays the x64 job's.
      - name: Tests (GL fallback)
        shell: bash
        run: |
          go env CC
          # internal/driver/mobile and .../mobile/app are excluded on this arch
          # only: app's package init downloads an ANGLE prebuilt keyed on
          # GOARCH, and Google never published a windows/arm64 one, so
          # gl.NewContext() panics before any test runs (mobile's test binary
          # inits app too). Upstream gomobile code, works on amd64 — see #17.
          # app is listed since it grew its first test file (#272); the other
          # mobile subpackages have no tests, so no binary ever inits app there.
          # Same collapsed-package-list guard as the x64 leg (pre-rebrand tracker #565).
          pkgs=$(go list -tags gl,ci,no_glfw,migrated_belluido ./... | grep -vE '/internal/driver/mobile(/app)?$' || true)
          n=$(printf '%s\n' "$pkgs" | grep -c . || true)
          echo "Resolved ${n} packages to test"
          if [ "${n}" -lt 50 ]; then
            echo "::error::go list resolved only ${n} packages — refusing to green-light a near-empty test run (#565)"
            exit 1
          fi
          go test -tags gl,ci,no_glfw,migrated_belluido ${pkgs}

      # The reason this job exists: compile and run the UIA bridge under
      # llvm-mingw.
      - name: Accessibility tagged tests
        shell: bash
        run: go test -tags accessibility,gl,ci,no_glfw,migrated_belluido ./internal/accessibility/... ./core/... ./internal/driver/glfw/

      # wgpu-native ships a windows/arm64 slice, so this guards the link.
      - name: WebGPU build (D3D12)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
        run: go build ./...

      # The x64 job's two GPU steps. The hosted windows-11-arm image
      # offers a D3D12 adapter, WARP (software, like x64's), so the goldens
      # match; probe run 40051597502 passed both with all backends enabled
      # (#15, #449). The Parallels GL crash that once forced
      # BELLUI_WEBGPU_BACKENDS=dx12 here does not reproduce on this image.
      # WARP is not a real Windows-on-ARM GPU; that stays open in #449.
      - name: WebGPU painter GPU tests (D3D12, arm64)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
          BELLUI_REQUIRE_WEBGPU: "1"
        run: go test -v -count=1 ./internal/painter/webgpu/

      # Real-window present + Canvas().Capture() on D3D12. The session caveat
      # on the x64 step applies here too.
      - name: WebGPU windowed present + Capture (D3D12, arm64)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
        run: go test -v -run TestWindowedSurfaceCapture -count=1 -timeout 120s ./internal/driver/glfw/
