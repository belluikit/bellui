name: Platform Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # cancel superseded runs on PR/feature branches, but never on main
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  platform_tests:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["stable"]
        platform: [linux, linux-x64, macos]
        include:
          - platform: linux
            runs-on: [self-hosted, Linux, ARM64]
            # -a (auto-servernum) so parallel self-hosted runners on one box
            # don't collide on Xvfb display :99.
            runner: ./.github/scripts/xvfb-run-safe
            # WebGPU is the default backend; the legacy GL/GLES path is now opt-in
            # via -tags gl. This comprehensive leg exercises the GL fallback (pure
            # Go link, no GPU) and holds the coverage gate; the webgpu_tests job
            # below covers the default WebGPU backend on a GPU.
            tags: gl,ci,migrated_belluido
            coverage: true
          # Same suite on x86_64. Every other Linux leg in this repo is ARM64, so
          # nothing was catching amd64-specific breakage: assembly and SIMD paths
          # (the vectorized newline scan in internal/textbuf), cgo struct layout
          # and alignment against the X11/Wayland/GL headers, and unsafe pointer
          # arithmetic all differ by arch. Pure Go link, no GPU — the GPU legs
          # stay on the two machines that have one.
          - platform: linux-x64
            runs-on: [self-hosted, Linux, X64]
            runner: ./.github/scripts/xvfb-run-safe
            tags: gl,ci,migrated_belluido
            # The ARM64 leg owns the coverage gate; running it twice would just
            # spend minutes to assert the same number.
            coverage: false
          - platform: macos
            runs-on: [self-hosted, macOS, ARM64]
            tags: gl,no_glfw,ci,migrated_belluido
            coverage: false

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assert go-plus toolchain
        run: |
          go version
          go version | grep -q '(plus)' || { echo "::error::runner go is not the go-plus fork"; exit 1; }


      - name: Get dependencies
        run: |
          flock /tmp/bellui-ci-apt.lock sudo apt-get -o DPkg::Lock::Timeout=600 update
          flock /tmp/bellui-ci-apt.lock sudo apt-get -o DPkg::Lock::Timeout=600 install --no-install-recommends bc clang lld libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev xvfb language-pack-en
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-fuse-ld=lld" >> "$GITHUB_ENV"
        if: ${{ runner.os == 'Linux' }}

      - name: Set environment variable LANG
        run: export LANG=en_EN.UTF-8
        if: ${{ runner.os == 'Linux' }}

      - name: Tests
        run: ${{ matrix.runner }} go test -race -tags "${{ matrix.tags }}" -covermode=atomic -coverprofile=coverage.out ./...

      # Accessibility semantic layer (#484) + platform backends (#485): the
      # tree walker and the NSAccessibility bridge only compile under
      # -tags accessibility, so exercise them explicitly on both desktop
      # platforms to keep the tagged code from rotting. The test build pulls
      # in widget/container/test with the tag set, which doubles as a
      # tagged compile gate for the wider tree; the glfw package compiles the
      # darwin cgo backend on the macOS leg (its heavy tests stay excluded by
      # the no_glfw/ci tags).
      - name: Accessibility tagged tests
        run: ${{ matrix.runner }} go test -race -tags "accessibility,${{ matrix.tags }}" ./internal/accessibility/... ./core/... ./internal/driver/glfw/

      # iOS accessibility compile gate (#1037): the `accessibility && ios`
      # slice (accessibility_ios.{go,m,h} + the iOS halves of the mobile
      # driver) needs the iPhone SDK, so only this leg can compile it — #1036
      # landed silently because none did. Compile-only, non-main packages
      # (no link, no signing): the iOS app closure (`app` selects the mobile
      # driver under GOOS=ios) plus every package carrying ios-tagged files.
      # Runtime coverage stays on-device.
      - name: iOS accessibility compile smoke
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CGO_CFLAGS="-isysroot $SDK -miphoneos-version-min=15.0 -w"
          export CGO_LDFLAGS="-isysroot $SDK -miphoneos-version-min=15.0"
          go build -tags accessibility ./app/ ./dialog/ ./storage/ ./widget/ ./theme/ ./internal/driver/mobile/...
        if: ${{ runner.os == 'macOS' }}

      - name: Wayland Tests
        run: go test -race -tags gl,no_glfw,ci,wayland ./...
        if: ${{ runner.os == 'Linux' }}

      # The default build now selects X11/Wayland at runtime (#542), so the
      # forced single-backend `x11` build is the only path not exercised above.
      # Compile-smoke the driver package in both painter modes so the forced-x11
      # files (backend_webgpu_x11.go, window_x11.go) can't rot.
      - name: X11 forced-build smoke
        run: |
          go build -tags x11 ./internal/driver/glfw/
          go build -tags gl,x11 ./internal/driver/glfw/
        if: ${{ runner.os == 'Linux' }}

      - name: Update coverage
        run: |
          set -e
          coverage=`go tool cover -func coverage.out | grep total | tr -s '\t' | cut -f 3 | grep -o '[^%]*'`
          if (( $(echo "$coverage < 62" | bc) )); then echo "Test coverage lowered"; exit 1; fi
        if: ${{ matrix.coverage && matrix.go-version == 'stable' }}


  # WebGPU is the default backend (Phase 5, #204). This job builds the default
  # ./... and runs the WebGPU painter's headless GPU readback tests on a real
  # adapter: Metal on the self-hosted mac, Vulkan (lavapipe) on the self-hosted
  # Linux box. The wgpu-native libs ship in the belluikit/webgpu module (no
  # system install); the link requires a clean CGO env (no -fuse-ld=lld).
  webgpu_tests:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: [self-hosted, Linux, ARM64]
            runner: ./.github/scripts/xvfb-run-safe
          - platform: macos
            runs-on: [self-hosted, macOS, ARM64]
            runner: ""
    env:
      # wgpu-native links cleanly only without the host's -fuse-ld=lld / CFLAGS.
      CGO_LDFLAGS: ""
      CGO_CFLAGS: ""
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assert go-plus toolchain
        run: |
          go version
          go version | grep -q '(plus)' || { echo "::error::runner go is not the go-plus fork"; exit 1; }


      - name: Get dependencies
        # -y: mesa-vulkan-drivers (lavapipe, a deterministic headless Vulkan ICD
        # for the readback tests) is a fresh install, so apt must not prompt.
        run: |
          flock /tmp/bellui-ci-apt.lock sudo apt-get -o DPkg::Lock::Timeout=600 update
          flock /tmp/bellui-ci-apt.lock sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends clang lld libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev xvfb mesa-vulkan-drivers libvulkan1
        if: ${{ runner.os == 'Linux' }}

      - name: Build default (WebGPU) ./...
        run: go build ./...

      - name: WebGPU painter GPU tests
        run: ${{ matrix.runner }} go test ./internal/painter/webgpu/...

      # Real-window surface configure → present → Canvas().Capture() coverage on
      # the default WebGPU backend (Metal on macOS, Vulkan/lavapipe on Linux).
      # Every other WebGPU GPU test is offscreen readback and never creates a
      # surface or presents; this is the only standing net for that path (#329).
      # No ci/gl/no_glfw tags so it builds WebGPU on a real window; the test
      # self-skips if no window/adapter is available. ./.github/scripts/xvfb-run-safe supplies the
      # Linux display; the macOS runner is an interactive desktop session.
      - name: WebGPU windowed present + Capture (#329)
        run: ${{ matrix.runner }} go test -run TestWindowedSurfaceCapture -count=1 -timeout 120s ./internal/driver/glfw/


  windows_tests:
    runs-on: [self-hosted, X64, Windows]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assert go-plus toolchain
        shell: powershell
        run: |
          go version
          if (-not (go version | Select-String '\(plus\)')) { Write-Error 'runner go is not the go-plus fork'; exit 1 }


      - name: Tests (GL fallback)
        shell: bash
        run: |
          # Resolve the package set. Under a service account `go list` can fail
          # VCS stamping ("dubious ownership") and print nothing to stdout; the
          # old inline $(go list ...) substitution then silently collapsed to a
          # single package and green-lit a ~24s near-empty run (#565). Refuse to
          # proceed on a collapsed list so the failure is loud, not silent.
          pkgs=$(go list -tags gl,ci,no_glfw,migrated_belluido ./... || true)
          n=$(printf '%s\n' "$pkgs" | grep -c . || true)
          echo "Resolved ${n} packages to test"
          if [ "${n}" -lt 50 ]; then
            echo "::error::go list resolved only ${n} packages — refusing to green-light a near-empty test run (#565)"
            exit 1
          fi
          go test -race -tags gl,ci,no_glfw,migrated_belluido ${pkgs}

      # Accessibility semantic layer (#484) + Windows UIA backend (#487):
      # the walker and the UIA cgo bridge only compile under
      # -tags accessibility, so exercise them explicitly — mirroring the
      # linux/macOS legs — to keep the tagged code (and its mingw build)
      # from rotting.
      - name: Accessibility tagged tests
        shell: bash
        run: go test -race -tags accessibility,gl,ci,no_glfw,migrated_belluido ./internal/accessibility/... ./core/... ./internal/driver/glfw/

      # WebGPU (default) on Windows = D3D12. Build the default ./... — this
      # links the wgpu-native archive and guards it from rotting. Clean CGO env
      # for the wgpu-native link.
      - name: WebGPU build (D3D12)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
        run: go build ./...

      # Headless GPU readback on the real GPU via the default all-backends
      # instance.
      - name: WebGPU painter GPU tests (D3D12)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
        run: go test -count=1 ./internal/painter/webgpu/...

      # Real-window present + Canvas().Capture() coverage on D3D12 (#329);
      # self-skips if no window/adapter. The x64 runner is an interactive
      # session.
      - name: WebGPU windowed present + Capture (D3D12, x64)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
        run: go test -run TestWindowedSurfaceCapture -count=1 -timeout 120s ./internal/driver/glfw/


  # Windows on ARM64, the second mingw flavor. The x64 runner builds the UIA cgo
  # bridge with winlibs gcc; this one uses llvm-mingw clang, and the two disagree
  # often enough to matter — the hand-written COM vtable slot offsets in
  # internal/driver/glfw/accessibility_windows.c are laid out against
  # uiautomationcore.h, and pointer-width-independent struct packing is exactly
  # the kind of thing only a second compiler catches. Deliberately a separate job
  # rather than a matrix leg on windows_tests: matrixing would rename that job's
  # check to `windows_tests (x64)` and silently drop it from any branch
  # protection rule referencing the old name.
  windows_arm64_tests:
    runs-on: [self-hosted, ARM64, Windows]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assert go-plus toolchain
        shell: powershell
        run: |
          go version
          if (-not (go version | Select-String '\(plus\)')) { Write-Error 'runner go is not the go-plus fork'; exit 1 }

      # No -race anywhere in this job: the race detector has no windows/arm64
      # support (`go build -race` fails outright with "-race is not supported on
      # windows/arm64"), so race coverage stays the x64 runner's job.
      - name: Tests (GL fallback)
        shell: bash
        run: |
          # internal/driver/mobile is excluded on this arch only: its package
          # init downloads an ANGLE prebuilt keyed on GOARCH, and Google never
          # published a windows/arm64 one, so gl.NewContext() panics before any
          # test runs. Upstream gomobile code, works on amd64 — see #17.
          # Same collapsed-package-list guard as the x64 leg (#565).
          pkgs=$(go list -tags gl,ci,no_glfw,migrated_belluido ./... | grep -v '/internal/driver/mobile$' || true)
          n=$(printf '%s\n' "$pkgs" | grep -c . || true)
          echo "Resolved ${n} packages to test"
          if [ "${n}" -lt 50 ]; then
            echo "::error::go list resolved only ${n} packages — refusing to green-light a near-empty test run (#565)"
            exit 1
          fi
          go test -tags gl,ci,no_glfw,migrated_belluido ${pkgs}

      # The reason this job exists: compile and run the UIA bridge under
      # llvm-mingw.
      - name: Accessibility tagged tests
        shell: bash
        run: go test -tags accessibility,gl,ci,no_glfw,migrated_belluido ./internal/accessibility/... ./core/... ./internal/driver/glfw/

      # Build-only. wgpu-native ships a windows/arm64 slice, so this guards the
      # link; the GPU test steps the x64 job runs are deliberately omitted until
      # a D3D12 adapter is confirmed usable under the Parallels virtual GPU —
      # see #15.
      - name: WebGPU build (D3D12)
        shell: bash
        env:
          CGO_LDFLAGS: ""
          CGO_CFLAGS: ""
        run: go build ./...
