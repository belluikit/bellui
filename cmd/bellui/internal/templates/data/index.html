<!DOCTYPE html>
<html>
	<head>
		<style>
			body {
				text-align:center;
			}
			.center {
				margin-left: auto;
  				margin-right: auto;
			}
			.centered-text {
				text-align: center;
			}
			.centered-container {
  				display: flex;
  				flex-direction: column;
  				align-items: center;
				justify-content: center;
				min-height: 100vh;
			}
			.application-icon {
  				display: block;
  				margin-left: auto;
  				margin-right: auto;
				max-width: 130px;
				max-height: 130px;
				width: auto;
				height: auto;
			}
			.spinner {
				max-width: 48px;
				max-height: 48px;
			}
			.credit {
				margin-top: 2em;
				font-family: sans-serif;
			}
		</style>
		<link rel="stylesheet" href="dark.css" media="(prefers-color-scheme: dark)" />
		<link rel="stylesheet" href="light.css" media="(prefers-color-scheme: light)" />
		<meta charset="utf-8">
		<!-- Without this, phone browsers lay the page out 980 px wide: the app
		     shows as a shrunken desktop page and its canvas gets ~6x the pixels. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<link rel="icon" type="image/png" href="icon.png">
		{{if not .IsReleased}}
			<script src="webgl-debug.js"></script>
		{{end}}
		<script>
			function async_load(file, cb) {
				var d = document, t = 'script',
      			o = d.createElement(t),
      			s = d.getElementsByTagName(t)[0];
  				o.src = file;
  				o.addEventListener('load', function (e) { cb(e); }, false);
  				s.parentNode.insertBefore(o, s);
			}

			function webgl_support () {
				try {
					var canvas = document.createElement('canvas');
					return !!window.WebGLRenderingContext &&
						(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
				} catch(e) {
					return false;
				}
			}

			function download_application() {
				var action = document.getElementById("action");
				var main = document.getElementById("main");

				if (webgl_support()) {
					if (WebAssembly) {
						action.innerHTML = "Downloading wasm_exec.js"
						async_load("wasm_exec.js", function(){
							// WebAssembly.instantiateStreaming is not currently available in Safari
							if (WebAssembly && !WebAssembly.instantiateStreaming) { // polyfill
								WebAssembly.instantiateStreaming = async (resp, importObject) => {
									const source = await (await resp).arrayBuffer();
									return await WebAssembly.instantiate(source, importObject);
								};
							}

							action.innerHTML = "Downloading web assembly file.";

							const go = new Go();

							// Hide the loading screen when Bellui creates its canvas
							var observer = new MutationObserver(function(mutations) {
								if (document.querySelector("canvas")) {
									main.style.display = "none";
									observer.disconnect();
								}
							});
							observer.observe(document.body, {childList: true, subtree: true});
							// Reject a failed download (404, network error) so the page
							// reports it instead of showing "Downloading" forever.
							const wasmResponse = fetch("{{.WasmFile}}").then((resp) => {
								if (!resp.ok) {
									throw new Error("HTTP " + resp.status + " for {{.WasmFile}}");
								}
								return resp;
							});
							WebAssembly.instantiateStreaming(wasmResponse, go.importObject).then((result) => {
								action.innerHTML = "Starting application.";
								// The WebGPU backend's zero-copy JS bridge reads
								// globalThis.wasm.instance.exports.mem.buffer, so the instance
								// must be exposed as window.wasm before the app runs (see
								// docs/webgpu.md). Harmless for the WebGL (-tags gl) build.
								window.wasm = result;
								go.run(result.instance);
							}).catch((err) => {
								console.error(err);
								action.innerHTML = "Could not load the application: " + err.message;
								action.className = "action-error";
							});
						})
					} else {
						action.innerHTML = "WebAssembly is not supported in your browser";
						action.className = "action-error"
					}
				} else {
					action.innerHTML = "WebGL is not supported in your browser";
					action.className = "action-error"
				}
			}
		</script>
	</head>
	<body scroll="no" style="overflow: hidden" onload="download_application()">
		<div id="main">
			<div class="centered-container">
			<table class="center">
				<tr><td><img class="application-icon" src="icon.png" alt="Application icon"/></td></tr>
				<tr><td><div class="centered-text"><div class="application-name">{{.AppName}}</div></div></td></tr>
				<tr><td><div class="centered-text"><div class="application-version">v{{.AppVersion}}</div></div></td></tr>
				<tr>
					<td>
						<picture>
  							<source srcset="spinner_dark.gif" media="(prefers-color-scheme: dark)" />
  							<source srcset="spinner_light.gif" media="(prefers-color-scheme: light)" />
  							<img class="spinner" src="spinner_light.gif" />
						</picture>
					</td>
				</tr>
				<tr>
					<td>
						<div class="centered-text"><div class="action" id="action">
							<noscript>Javascript need to be enable for this application to work.</noscript>
						</div></div>
					</td>
				</tr>
				<!-- The spinner is CC BY 4.0 artwork, which must be credited where it is shown. -->
				<tr><td><div class="centered-text credit">Gopher artwork based on the Go gopher by Renée French, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></div></td></tr>
			</table>
			</div>
		</div>
	    <input id="dummyEntry" style="position: absolute; left: 0; top: -100pt; z-index: -10; font-size: 32pt;" />
	</body>
</html>
